<div class="menu">
    <nav>
        @if (gameOngoing()) {
            <a routerLink="/game" routerLinkActive="active" class="meeting-title">{{ meeting() }}</a>
        } @else {
            <a routerLink="/meetings" routerLinkActive="active" ptI18n="menu.meetings"></a>
            @if(meetingsExist()) {
                <a routerLink="/buzzwords" routerLinkActive="active" ptI18n="menu.buzzwords"></a>
            }
            @if(enoughWords()) {
                <a routerLink="/new-game" routerLinkActive="active" ptI18n="menu.newGame"></a>
            }
        }
    </nav>
    <nav>
        @if(gameVisible()) {
            <a (click)="onReset()" ptI18n="game.reset"></a>
            <a (click)="onExitGame()" ptI18n="game.exit"></a>    
        }
    </nav>
    <nav>
        <a routerLink="/settings" routerLinkActive="active" ptI18n="menu.settings" class="hidden-portrait"></a>
        <a [ptDropDownButton]="dropdown"><img src="icons/menu.svg" draggable="false"></a>
    </nav>        
</div>
<div class="popup" #dropdown>
    <a routerLink="/settings" routerLinkActive="active" ptI18n="menu.settings" class="visible-portrait"></a>
    <a routerLink="/rules" routerLinkActive="active" ptI18n="menu.rules"></a>
    <a routerLink="/about" routerLinkActive="active" ptI18n="menu.about"></a>        
</div>
